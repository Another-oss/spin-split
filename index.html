<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin & Split — Neon Cat Edition</title>

<style>
:root {
  --bg: #080812;
  --panel: #151528;
  --pink: #ff4fd8;
  --purple: #a855f7;
  --cyan: #22d3ee;
  --lime: #b7ff5e;
  --text: #f5f3ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 18px;
  font-family: Arial, sans-serif;
  color: var(--text);

  background:
    radial-gradient(circle at top, #28103d, transparent 50%),
    var(--bg);
}

.container {
  max-width: 900px;
  margin: auto;
}

header {
  text-align: center;
  margin-bottom: 25px;
}

header h1 {
  color: var(--pink);
  font-size: clamp(28px, 6vw, 45px);
  text-shadow: 0 0 15px var(--pink);
  margin-bottom: 8px;
}

header p {
  color: #c4b5fd;
}

.panel {
  background: var(--panel);
  border: 1px solid #553080;
  border-radius: 18px;
  padding: 20px;
  margin-bottom: 20px;

  box-shadow: 0 0 20px #a855f722;
}

/* JUDUL PEMBAGIAN KELOMPOK */

.panel-title {
  color: var(--cyan);
  text-shadow: 0 0 8px var(--cyan);

  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;

  text-align: center;
  margin-top: 0;
}

/* KUCING MELAYANG DI SAMPING JUDUL */

.floating-cat {
  display: inline-block;
  font-size: 28px;

  animation: floatingCat 2s ease-in-out infinite;
}

@keyframes floatingCat {
  0%, 100% {
    transform: translateY(0);
  }

  50% {
    transform: translateY(-7px);
  }
}

/* AREA RODA */

.wheel-area {
  position: relative;

  width: min(100%, 440px);
  aspect-ratio: 1;

  margin: 25px auto;
}

#wheel {
  width: 100%;
  height: 100%;
  display: block;

  filter: drop-shadow(0 0 15px #a855f7);
}

/* PENUNJUK RODA */

.pointer {
  position: absolute;
  top: -8px;
  left: 50%;

  transform: translateX(-50%);

  z-index: 5;

  color: var(--lime);
  font-size: 38px;

  text-shadow: 0 0 12px var(--lime);
}

/* TOMBOL EMOJI TENGAH */

.spin-button {
  position: absolute;

  top: 50%;
  left: 50%;

  transform: translate(-50%, -50%);

  width: 100px;
  height: 100px;

  border-radius: 50%;

  display: flex;
  align-items: center;
  justify-content: center;

  background: #160d2b;

  border: 3px solid var(--pink);

  box-shadow:
    0 0 18px var(--pink),
    inset 0 0 15px #a855f755;

  cursor: pointer;

  z-index: 4;

  padding: 0;
}

/* EMOJI LEBIH BESAR */

.spin-emoji {
  display: inline-block;

  font-size: 58px;
  line-height: 1;

  transform-origin: center;
}

/* EMOJI BERPUTAR KANAN KE KIRI */

.spin-button.spinning .spin-emoji {
  animation: catSpin 0.5s linear infinite;
}

@keyframes catSpin {
  from {
    transform: rotate(0deg);
  }

  to {
    transform: rotate(-360deg);
  }
}

/* BUTTON */

button {
  border: none;
  border-radius: 10px;

  padding: 12px 18px;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;

  transition: 0.2s;
}

button:hover {
  filter: brightness(1.15);
}

button:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

.primary {
  background: linear-gradient(135deg, var(--pink), var(--purple));
  color: white;

  box-shadow: 0 0 12px #ff4fd855;
}

.secondary {
  background: #292943;
  color: white;

  border: 1px solid #6655aa;
}

.button-row {
  display: flex;
  flex-wrap: wrap;

  justify-content: center;
  gap: 10px;

  margin-top: 15px;
}

/* INPUT */

textarea,
input,
select {
  width: 100%;

  padding: 12px;

  border-radius: 10px;
  border: 1px solid #594078;

  background: #0d0d1b;
  color: white;

  margin-top: 8px;

  font-size: 15px;
}

label {
  display: block;
  margin-top: 15px;

  color: #d8b4fe;
}

input[type="range"] {
  padding: 0;
}

input[type="checkbox"] {
  width: auto;
}

/* STATUS */

.status {
  text-align: center;

  color: var(--lime);

  min-height: 25px;
  margin-top: 12px;
}

/* HASIL KELOMPOK */

.results {
  display: grid;

  grid-template-columns: repeat(
    auto-fit,
    minmax(180px, 1fr)
  );

  gap: 15px;

  margin-top: 15px;
}

.group-card {
  background: #20152f;

  border: 1px solid var(--purple);
  border-radius: 12px;

  padding: 15px;

  box-shadow: 0 0 12px #a855f722;
}

.group-card h3 {
  color: var(--pink);
  margin-top: 0;
}

.group-card li {
  margin: 8px 0;
}

footer {
  text-align: center;

  color: #77718e;
  font-size: 12px;

  margin-top: 25px;
}

/* MOBILE */

@media (max-width: 500px) {
  body {
    padding: 12px;
  }

  .panel {
    padding: 15px;
  }

  .spin-button {
    width: 82px;
    height: 82px;
  }

  .spin-emoji {
    font-size: 48px;
  }

  .floating-cat {
    font-size: 24px;
  }
}
</style>
</head>

<body>

<div class="container">

<header>
  <h1>🐱 Spin & Split</h1>
  <p>Neon Cat Edition</p>
</header>

<!-- PEMBAGIAN KELOMPOK -->

<section class="panel">

  <h2 class="panel-title">
    <span class="floating-cat">🐱</span>
    Pembagian Kelompok
    <span class="floating-cat">🐱</span>
  </h2>

  <div class="wheel-area">

    <div class="pointer">▼</div>

    <canvas id="wheel" width="600" height="600"></canvas>

    <!-- EMOJI TENGAH RODA -->

    <button class="spin-button" id="spinBtn">
      <span class="spin-emoji">🐱</span>
    </button>

  </div>

  <div class="button-row">

    <button class="primary" id="spinAction">
      🎡 Putar & Bagi Kelompok
    </button>

    <button class="secondary" id="resetBtn">
      🔄 Reset
    </button>

  </div>

  <div class="status" id="status">
    Siap melakukan undian! 😺
  </div>

</section>

<!-- PENGATURAN -->

<section class="panel">

  <h2 class="panel-title">⚙️ Pengaturan</h2>

  <label for="participants">
    Daftar peserta (satu nama per baris)
  </label>

  <textarea id="participants" rows="8">Anto
Alfin
Juni
Eka
Dede
Ririn
Lia
Feni</textarea>

  <label for="groupCount">
    Jumlah kelompok
  </label>

  <input
    type="number"
    id="groupCount"
    min="2"
    max="20"
    value="2"
  >

  <div class="button-row">

    <button class="primary" id="applyBtn">
      Terapkan Pengaturan
    </button>

  </div>

  <label>
    <input type="checkbox" id="soundToggle" checked>
    🔊 Efek suara
  </label>

  <label for="volume">
    🔉 Volume: <span id="volumeValue">65%</span>
  </label>

  <input
    type="range"
    id="volume"
    min="0"
    max="100"
    value="65"
  >

</section>

<!-- HASIL -->

<section class="panel">

  <h2 class="panel-title">
    🏆 Hasil Pembagian
  </h2>

  <div id="results" class="results">
    <p>Hasil kelompok akan muncul di sini.</p>
  </div>

  <div class="button-row">

    <button class="primary" id="copyBtn">
      📋 Salin Hasil
    </button>

  </div>

</section>

<footer>
  Spin & Split — Neon Cat Edition
</footer>

</div>

<script>

/* ELEMENTS */

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");

const spinBtn = document.getElementById("spinBtn");
const spinAction = document.getElementById("spinAction");

const resetBtn = document.getElementById("resetBtn");
const applyBtn = document.getElementById("applyBtn");
const copyBtn = document.getElementById("copyBtn");

const participantsInput =
  document.getElementById("participants");

const groupCountInput =
  document.getElementById("groupCount");

const soundToggle =
  document.getElementById("soundToggle");

const volumeSlider =
  document.getElementById("volume");

const volumeValue =
  document.getElementById("volumeValue");

const statusDisplay =
  document.getElementById("status");

const resultsDisplay =
  document.getElementById("results");


/* VARIABLES */

let participants = [];
let groups = [];

let drawnCount = 0;
let isSpinning = false;

let rotation = 0;

const spinDuration = 5000;

let audioContext = null;


/* SOUND */

function getAudioContext() {

  if (!audioContext) {
    audioContext = new (
      window.AudioContext ||
      window.webkitAudioContext
    )();
  }

  if (audioContext.state === "suspended") {
    audioContext.resume();
  }

  return audioContext;
}

function playTick(
  frequency = 600,
  duration = 0.04
) {

  if (!soundToggle.checked) return;

  const audio = getAudioContext();

  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  const volume =
    Number(volumeSlider.value) / 100;

  oscillator.type = "triangle";

  oscillator.frequency.value = frequency;

  gain.gain.setValueAtTime(
    volume * 0.12,
    audio.currentTime
  );

  gain.gain.exponentialRampToValueAtTime(
    0.001,
    audio.currentTime + duration
  );

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start();

  oscillator.stop(
    audio.currentTime + duration
  );
}

function playWinnerSound() {

  if (!soundToggle.checked) return;

  playTick(700, 0.15);

  setTimeout(() => {
    playTick(900, 0.2);
  }, 120);

  setTimeout(() => {
    playTick(1100, 0.25);
  }, 250);
}


/* READ PARTICIPANTS */

function readParticipants() {

  return participantsInput.value
    .split("\n")
    .map(name => name.trim())
    .filter(name => name.length > 0);

}


/* DRAW WHEEL */

function drawWheel() {

  const size = canvas.width;

  const center = size / 2;

  const radius = size / 2 - 8;

  ctx.clearRect(0, 0, size, size);

  if (participants.length === 0) return;

  const slice =
    (Math.PI * 2) / participants.length;

  const colors = [
    "#a855f7",
    "#ec4899",
    "#06b6d4",
    "#7c3aed",
    "#f472b6",
    "#0891b2",
    "#9333ea",
    "#db2777"
  ];

  participants.forEach((name, index) => {

    const start =
      rotation + index * slice;

    const end = start + slice;

    ctx.beginPath();

    ctx.moveTo(center, center);

    ctx.arc(
      center,
      center,
      radius,
      start,
      end
    );

    ctx.closePath();

    ctx.fillStyle =
      colors[index % colors.length];

    ctx.fill();

    ctx.strokeStyle = "#ffffff55";
    ctx.lineWidth = 3;

    ctx.stroke();

    ctx.save();

    ctx.translate(center, center);

    ctx.rotate(start + slice / 2);

    ctx.textAlign = "right";
    ctx.textBaseline = "middle";

    ctx.fillStyle = "#ffffff";

    ctx.font = "bold 22px Arial";

    let displayName = name;

    if (displayName.length > 15) {
      displayName =
        displayName.slice(0, 13) + "...";
    }

    ctx.fillText(
      displayName,
      radius - 25,
      0
    );

    ctx.restore();

  });

  /* CENTER DECORATION */

  ctx.beginPath();

  ctx.arc(
    center,
    center,
    65,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = "#160d2b";

  ctx.fill();

  ctx.strokeStyle = "#ff4fd8";
  ctx.lineWidth = 5;

  ctx.stroke();

}


/* SHUFFLE */

function shuffle(array) {

  const result = [...array];

  for (
    let i = result.length - 1;
    i > 0;
    i--
  ) {

    const j =
      Math.floor(Math.random() * (i + 1));

    [result[i], result[j]] =
      [result[j], result[i]];

  }

  return result;

}


/* GROUP SPLITTING */

function splitGroups() {

  const count =
    Number(groupCountInput.value);

  if (count < 2 || count > 20) {

    alert(
      "Jumlah kelompok harus antara 2 sampai 20."
    );

    return false;
  }

  if (participants.length < count) {

    alert(
      "Jumlah peserta harus minimal sama dengan jumlah kelompok."
    );

    return false;
  }

  groups = [];

  for (let i = 0; i < count; i++) {

    groups.push({

      name: `Kelompok ${i + 1}`,

      members: []

    });

  }

  let shuffled = shuffle(participants);

  /*
    ATURAN KHUSUS ANTO DAN EKA

    Kapasitas kelompok >= 5:
    peluang pemisahan 50%.

    Kapasitas kelompok < 5:
    peluang pemisahan 98%.
  */

  const hasCapacityFiveOrMore =
    Math.ceil(participants.length / count) >= 5;

  const separationChance =
    hasCapacityFiveOrMore ? 0.50 : 0.98;

  const anto = shuffled.find(
    name => name.toLowerCase() === "anto"
  );

  const eka = shuffled.find(
    name => name.toLowerCase() === "eka"
  );

  if (
    anto &&
    eka &&
    Math.random() < separationChance
  ) {

    const antoIndex =
      shuffled.indexOf(anto);

    const ekaIndex =
      shuffled.indexOf(eka);

    if (
      Math.floor(antoIndex / count) ===
      Math.floor(ekaIndex / count)
    ) {

      const otherIndex =
        shuffled.findIndex(
          (name, index) =>
            index !== ekaIndex &&
            Math.floor(index / count) !==
            Math.floor(antoIndex / count)
        );

      if (otherIndex !== -1) {

        [
          shuffled[ekaIndex],
          shuffled[otherIndex]
        ] = [
          shuffled[otherIndex],
          shuffled[ekaIndex]
        ];

      }

    }

  }

  /* DISTRIBUSI MERATA */

  shuffled.forEach((name, index) => {

    groups[index % count].members.push(name);

  });

  return true;

}


/* DISPLAY RESULTS */

function displayResults() {

  resultsDisplay.innerHTML = "";

  groups.forEach(group => {

    const card =
      document.createElement("div");

    card.className = "group-card";

    const title =
      document.createElement("h3");

    title.textContent = group.name;

    const list =
      document.createElement("ol");

    group.members.forEach(member => {

      const item =
        document.createElement("li");

      item.textContent = member;

      list.appendChild(item);

    });

    card.appendChild(title);
    card.appendChild(list);

    resultsDisplay.appendChild(card);

  });

}


/* SPIN */

function spin() {

  if (isSpinning) return;

  participants = readParticipants();

  if (participants.length < 2) {

    alert("Masukkan minimal 2 peserta.");

    return;
  }

  if (!splitGroups()) return;

  isSpinning = true;

  spinBtn.classList.add("spinning");

  spinBtn.disabled = true;
  spinAction.disabled = true;

  statusDisplay.textContent =
    "Roda sedang berputar... 😺";

  resultsDisplay.innerHTML =
    "<p>Menentukan kelompok...</p>";

  const startRotation = rotation;

  const extraRotation =
    Math.PI * 2 * (6 + Math.random() * 5);

  const startTime = performance.now();

  let lastTick = 0;

  function animate(now) {

    const elapsed =
      now - startTime;

    const progress =
      Math.min(elapsed / spinDuration, 1);

    /* RODA MELAMBAT SECARA ALAMI */

    const eased =
      1 - Math.pow(1 - progress, 4);

    rotation =
      startRotation +
      extraRotation * eased;

    drawWheel();

    /* SOUND */

    const tickInterval =
      45 + progress * 250;

    if (now - lastTick > tickInterval) {

      playTick(
        500 + Math.random() * 300
      );

      lastTick = now;

    }

    if (progress < 1) {

      requestAnimationFrame(animate);

    } else {

      finishSpin();

    }

  }

  requestAnimationFrame(animate);

}


/* FINISH SPIN */

function finishSpin() {

  isSpinning = false;

  spinBtn.classList.remove("spinning");

  spinBtn.disabled = false;
  spinAction.disabled = false;

  drawnCount++;

  displayResults();

  playWinnerSound();

  statusDisplay.textContent =
    "Undian selesai! Selamat untuk semua kelompok 🎉";

}


/* APPLY SETTINGS */

function applySettings() {

  participants = readParticipants();

  const count =
    Number(groupCountInput.value);

  if (participants.length < 2) {

    alert("Masukkan minimal 2 peserta.");

    return;
  }

  if (count < 2 || count > 20) {

    alert(
      "Jumlah kelompok harus antara 2 sampai 20."
    );

    return;
  }

  if (count > participants.length) {

    alert(
      "Jumlah kelompok tidak boleh melebihi peserta."
    );

    return;
  }

  groups = [];

  resultsDisplay.innerHTML =
    "<p>Pengaturan berhasil diterapkan.</p>";

  rotation = 0;

  drawWheel();

  statusDisplay.textContent =
    "Pengaturan berhasil diterapkan!";

}


/* RESET */

function resetGame() {

  if (isSpinning) return;

  rotation = 0;

  groups = [];

  drawnCount = 0;

  spinBtn.classList.remove("spinning");

  resultsDisplay.innerHTML =
    "<p>Hasil kelompok akan muncul di sini.</p>";

  statusDisplay.textContent =
    "Undian direset. Siap mulai lagi! 😺";

  drawWheel();

}


/* COPY RESULTS */

async function copyResults() {

  if (!drawnCount) {

    alert("Belum ada hasil undian.");

    return;
  }

  let text =
    "🎉 HASIL PEMBAGIAN KELOMPOK 🎉\n\n";

  groups.forEach(group => {

    text += group.name + ":\n";

    group.members.forEach((member, i) => {

      text += `${i + 1}. ${member}\n`;

    });

    text += "\n";

  });

  try {

    await navigator.clipboard.writeText(text);

    statusDisplay.textContent =
      "Hasil berhasil disalin!";

  } catch (error) {

    const area =
      document.createElement("textarea");

    area.value = text;

    document.body.appendChild(area);

    area.select();

    document.execCommand("copy");

    area.remove();

    statusDisplay.textContent =
      "Hasil berhasil disalin!";

  }

}


/* BUTTON EVENTS */

spinBtn.onclick = spin;

resetBtn.onclick = resetGame;

applyBtn.onclick = applySettings;

copyBtn.onclick = copyResults;

spinAction.onclick = spin;


/* INITIALIZE */

applySettings();

</script>

</body>
  </html>
